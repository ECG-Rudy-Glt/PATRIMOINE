name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tests unitaires des services + schéma SQL sur une base jetable + fonctions SQL clés
      - name: Tests
        run: ./scripts/test.sh
      - name: Le schéma de démarrage se construit
        run: |
          ./scripts/setup.sh
          docker compose config -q
