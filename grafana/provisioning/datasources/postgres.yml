apiVersion: 1
datasources:
  - name: patrimoine
    uid: patrimoine-pg
    isDefault: true
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
