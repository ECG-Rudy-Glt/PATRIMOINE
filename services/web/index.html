<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Patrimoine</title>
    <meta name="description" content="Suivi du patrimoine et du budget du foyer" />
    <!-- Couleur de la barre système : suit le thème (mise à jour par theme.ts quand le thème est forcé) -->
    <meta name="theme-color" content="%THEME_LIGHT%" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="%THEME_DARK%" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Patrimoine" />
    <!-- use-credentials : le manifeste passe par l'authentification du reverse proxy comme le reste (sinon Chrome le récupère sans cookie) -->
    <script src="/theme-init.js"></script>
    <link rel="manifest" href="/manifest.webmanifest?v=2" crossorigin="use-credentials" />
    <link rel="icon" href="/icons/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png?v=2" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
