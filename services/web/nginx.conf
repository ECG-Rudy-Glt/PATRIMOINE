# Jeton de l'API Home Assistant (/ha/) : fichier généré au démarrage par ha-token.sh (jamais dans l'image).
include /etc/nginx/ha-auth.map;

# Plafonds des paramètres de /ha/transactions et /ha/advisor/recommendations (valeur invalide = plafond)
map $arg_limit $ha_limit { default 100; "" 50; "~^(?<n>[0-9]{1,2})$" $n; }
map $arg_limit $ha_reco_limit { default 20; "" 10; "~^(?<n>[0-9]|1[0-9])$" $n; }
map $arg_offset $ha_q_offset { default ""; "~^[0-9]{1,7}$" "&offset=$arg_offset"; }
map $arg_account_id $ha_q_account { default ""; "~^[0-9]{1,9}$" "&account_id=$arg_account_id"; }
map $arg_person $ha_q_person { default ""; "~^[0-9]{1,9}$" "&person=$arg_person"; }
map $arg_direction $ha_q_direction { default ""; "in" "&direction=in"; "out" "&direction=out"; }
map $arg_category $ha_q_category { default ""; "~^[a-z0-9_]{1,40}$" "&category=$arg_category"; }

server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 8m;   # import d'historique bancaire (CSV/OFX)

  # Résolution DNS à chaque requête (variables) : un service recréé change d'IP sans casser le proxy.
  # Docker : 127.0.0.11 ; k8s : surchargé par NGINX_RESOLVER au démarrage (voir Dockerfile).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $ledger http://ledger__SEARCH__:8000;
  set $budget http://budget-engine__SEARCH__:8000;
  set $reporting http://reporting__SEARCH__:8000;
  set $advisor http://advisor__SEARCH__:8000;
  set $alloc http://allocation-engine__SEARCH__:8000;
  set $bank http://bank-api__SEARCH__:8000;

  # Retour de la banque : l'URL porte le code d'autorisation, jamais journalisé
  location = /api/bank/callback { access_log off; rewrite ^/api/(.*)$ /$1 break; proxy_pass $bank; }
  location /api/bank/ { rewrite ^/api/(.*)$ /$1 break; proxy_pass $bank; }

  # --- API Home Assistant : lecture seule, jeton Bearer, liste blanche stricte -------------------
  # Les gardes sont dans /ha/ ; les cibles sont dans /_ha/ (internal : atteintes uniquement par la réécriture).
  location ^~ /ha/ {
    if ($ha_enabled = 0) { return 404; }                                   # HA_API_TOKEN absent ou trop court
    if ($ha_authed = 0) { add_header WWW-Authenticate 'Bearer realm="patrimoine"' always; return 401; }
    if ($request_method !~ ^(GET|HEAD)$) { add_header Allow 'GET, HEAD' always; return 405; }
    rewrite ^/ha/(.*)$ /_ha/$1 last;
  }
  location /_ha/ { internal; return 404; }                                 # tout ce qui n'est pas listé (préfixe simple : les regex ci-dessous passent avant)
  # Réponses « liste » (tableau JSON à la racine) enveloppées en {"items": [...]} : le capteur REST de HA
  # n'extrait des attributs que d'un objet (ha-list.inc). Les réponses « objet » passent telles quelles.
  location = /_ha/accounts { internal; include /etc/nginx/ha-proxy.inc; include /etc/nginx/ha-list.inc; proxy_pass $ledger/accounts$is_args$args; }
  location = /_ha/persons { internal; include /etc/nginx/ha-proxy.inc; include /etc/nginx/ha-list.inc; proxy_pass $ledger/persons$is_args$args; }
  location = /_ha/summary { internal; include /etc/nginx/ha-proxy.inc; proxy_pass $ledger/summary$is_args$args; }
  location = /_ha/transactions {   # déjà un objet {total, items}
    internal; include /etc/nginx/ha-proxy.inc;
    # limit plafonné à 100 ; les autres filtres sont reconstruits (aucun paramètre dupliqué possible)
    proxy_pass $ledger/transactions?limit=$ha_limit$ha_q_offset$ha_q_account$ha_q_person$ha_q_direction$ha_q_category;
  }
  location ~ ^/_ha/budget/(monthly|breakdown|forecast|caps|goals|pay|cashflow)$ {
    internal; include /etc/nginx/ha-proxy.inc; include /etc/nginx/ha-list.inc; proxy_pass $budget/budget/$1$is_args$args;
  }
  location ~ ^/_ha/budget/(summary|current|recurring|household|flows|transfers|ha)$ {
    internal; include /etc/nginx/ha-proxy.inc; proxy_pass $budget/budget/$1$is_args$args;
  }
  location = /_ha/advisor/recommendations {
    internal; include /etc/nginx/ha-proxy.inc; include /etc/nginx/ha-list.inc;
    proxy_pass $advisor/advisor/recommendations?limit=$ha_reco_limit;
  }
  location = /_ha/advisor/stats {
    internal; include /etc/nginx/ha-proxy.inc; include /etc/nginx/ha-list.inc; proxy_pass $advisor/advisor/stats;
  }
  location ~ ^/_ha/advisor/(status|context)$ {
    internal; include /etc/nginx/ha-proxy.inc; proxy_pass $advisor/advisor/$1;
  }
  location = /_ha_open { internal; default_type application/json; return 200 '{"items":'; }
  location = /_ha_close { internal; default_type application/json; return 200 '}'; }

  # Envoi Web Push : réservé aux services internes (récap, rapport, banque), jamais depuis le navigateur
  location = /api/push/send { return 404; }

  location /api/alloc/ { rewrite ^/api/(.*)$ /$1 break; proxy_pass $alloc; client_max_body_size 2m; }
  location /api/advisor/ { rewrite ^/api/(.*)$ /$1 break; proxy_pass $advisor; proxy_read_timeout 300s; }
  location /api/export/ { rewrite ^/api/(.*)$ /$1 break; proxy_pass $reporting; proxy_read_timeout 120s; }
  location /api/digest/ { rewrite ^/api/(.*)$ /$1 break; proxy_pass $reporting; }
  location /api/budget/ { rewrite ^/api/(.*)$ /$1 break; proxy_pass $budget; }
  location /api/ { rewrite ^/api/(.*)$ /$1 break; proxy_pass $ledger; }
  # PWA : service worker et manifeste toujours revalidés (sinon une mise à jour du SW peut mettre 24 h à arriver)
  location = /sw.js { add_header Cache-Control "no-cache" always; add_header Service-Worker-Allowed "/" always; try_files $uri =404; }
  location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache" always; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache" always; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache" always; try_files $uri /index.html; }
}
