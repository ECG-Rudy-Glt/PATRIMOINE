<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="%THEME_LIGHT%" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="%THEME_DARK%" media="(prefers-color-scheme: dark)">
  <title>Patrimoine — hors connexion</title>
  <style>
    :root { --bg: %THEME_LIGHT%; --text: #0E1118; --muted: #5E687D; --accent: #0E1118; }
    @media (prefers-color-scheme: dark) { :root { --bg: %THEME_DARK%; --text: #F2F3F7; --muted: #A3ABBD; --accent: #F2F3F7; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
           font: 16px/1.5 system-ui, -apple-system, sans-serif; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
    main { max-width: 22rem; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    p { color: var(--muted); }
    button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: .7rem 1.4rem; background: var(--accent); color: var(--bg); }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>Hors connexion</h1>
    <p>Patrimoine a besoin du réseau : aucune donnée n'est conservée sur ce téléphone.</p>
    <button onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
